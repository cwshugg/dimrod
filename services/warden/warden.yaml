  log: stdout
  auth_cookie: warden_auth
  auth_secret: YOUR_JWT_SECRET_HERE
  auth_users:
  - username: finrod
    password: felagund
    privilege: 0
  - username: fingolfin
    password: ringil
    privilege: 1
known_devices:
- name: Feanor's Smithing Hammer
  macaddrs:
  - 01:23:45:67:89:ab:cd:ef
  tags:
  - tool
- name: Melkor's Iron Crown
  macaddrs:
  - ff:ff:ff:ff:ff:ff:ff:ff
  tags:
  - apparel
# On-disk SQLite database used to durably mirror the device cache so it survives
# a service restart. `path` selects the file (defaults to ".warden.db" next to
# the service). The remaining keys tune the shared sqlite3 connection used by
# warden's worker-thread pool: `check_same_thread` must stay false so the single
# connection can be used across threads, and `timeout` / `busy_timeout_ms`
# control how long sqlite waits on a locked database before raising.
database:
  path: .warden.db
  check_same_thread: false
  timeout: 5.0
  busy_timeout_ms: 5000
# Number of seconds after which a device that has not been seen is pruned from
# both the in-memory cache and the database. Defaults to 604800 (1 week).
device_ttl: 604800
# Background job system: size of the worker-thread pool that runs scan/
# ARP-poison/sweep jobs off the main service thread. Must be greater than 0.
job_workers: 3
# How long (seconds) a finished job is retained so its status/result can be
# polled via the API before it is evicted. Defaults to 3600 (1 hour).
job_result_ttl: 3600
# Default duration (seconds) of an ARP-poison block job when none is requested.
# An ARP-poison block cuts a single local-network device off the LAN by
# poisoning its ARP cache (via arpspoof) and black-holing its traffic.
arppoison_default_duration: 60
# Absolute upper bound (seconds) an ARP-poison block may EVER run, regardless of
# the requested/default duration. ARP-poison blocks are additionally restricted
# to targets on warden's own local subnet.
arppoison_hard_cap: 300
# Cadence (seconds) of the routine per-device open-port / OS-detection scans.
# Defaults to 3600 (1 hour).
device_scan_interval: 3600
